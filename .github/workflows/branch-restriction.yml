name: Restrict PR Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" != "dev" && "${{ github.head_ref }}" != "qa" ]]; then
            echo "Only PRs from dev or qa branches are allowed."
            exit 1
          fi
